<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新感覚！ジャンケン三目並べ (遠隔オンライン対戦＆囲み丸デザイン版)</title>
<!-- PeerJS (WebRTC P2P通信ライブラリ) -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg-dark: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.9);
    --sente-color: #ffffff;
    --gote-color: #ef4444;
    --accent: #f59e0b;
    --cell-bg: #1e293b;
    --cell-hover: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: #475569;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  header { text-align: center; margin-bottom: 10px; }
  h1 {
    font-size: 1.6rem;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff, #f59e0b, #ef4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

  .app-container {
    width: 100%;
    max-width: 880px;
    display: grid;
    grid-template-columns: 1fr 310px;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 820px) { .app-container { grid-template-columns: 1fr; } }

  .game-area {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    backdrop-filter: blur(10px);
  }

  .status-bar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding: 8px 12px;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 12px;
  }
  .player-tag { font-weight: 700; font-size: 0.88rem; padding: 4px 8px; border-radius: 8px; display: flex; align-items: center; gap: 4px; }
  .player-tag.sente { color: #ffffff; }
  .player-tag.gote { color: #ef4444; }
  .player-tag.active { background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 12px currentColor; }

  .online-role-badge {
    font-size: 0.68rem;
    padding: 2px 6px;
    border-radius: 4px;
    background: #3b82f6;
    color: #fff;
    margin-left: 4px;
  }

  .message-banner {
    width: 100%;
    text-align: center;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 8px;
    border-radius: 8px;
    margin-bottom: 10px;
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid var(--accent);
    color: #fbbf24;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .message-banner.target-mode {
    background: rgba(239, 68, 68, 0.2);
    border-color: var(--gote-color);
    color: #fca5a5;
    animation: pulse 1.5s infinite;
  }
  .message-banner.wait-mode {
    background: rgba(100, 116, 139, 0.2);
    border-color: #64748b;
    color: #cbd5e1;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

  .board-wrapper {
    position: relative;
    padding: 6px;
    background: #090d16;
    border-radius: 14px;
    border: 2px solid #334155;
    min-width: 320px;
    min-height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(5, 62px);
    grid-template-rows: repeat(5, 62px);
    gap: 5px;
    width: fit-content;
    height: fit-content;
  }
  @media (max-width: 480px) {
    .board-wrapper { min-width: 280px; min-height: 280px; }
    .board { grid-template-columns: repeat(5, 54px); grid-template-rows: repeat(5, 54px); gap: 4px; }
  }

  .cell {
    background: var(--cell-bg);
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: all 0.2s ease;
    width: 100%;
    height: 100%;
  }
  .cell:hover:not(.occupied-cell) {
    background: var(--cell-hover);
    border-color: rgba(255, 255, 255, 0.3);
  }
  .cell.highlight-line { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; }
  .cell.target-selectable {
    background: rgba(239, 68, 68, 0.35) !important;
    border: 2px dashed #ef4444 !important;
    box-shadow: 0 0 14px rgba(239, 68, 68, 0.8);
    animation: targetPulse 1s infinite alternate;
  }
  @keyframes targetPulse { from { transform: scale(0.96); } to { transform: scale(1.04); } }
  .cell.win-line {
    background: rgba(245, 158, 11, 0.4) !important;
    border: 2px solid #fbbf24 !important;
    box-shadow: 0 0 20px #f59e0b;
  }

  .hand-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    position: relative;
  }

  .plain-hand {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .plain-hand .hand-icon { font-size: 1.5rem; }
  .plain-hand .hand-owner {
    font-size: 0.55rem;
    font-weight: 700;
    padding: 1px 3px;
    border-radius: 3px;
    margin-top: -2px;
  }
  .plain-hand.sente .hand-owner { background: rgba(255, 255, 255, 0.2); color: #ffffff; border: 1px solid #ffffff; }
  .plain-hand.gote .hand-owner { background: rgba(239, 68, 68, 0.3); color: #f87171; border: 1px solid #ef4444; }

  .encircled-ring {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: all 0.3s;
  }
  @media (max-width: 480px) {
    .encircled-ring { width: 42px; height: 42px; }
  }

  .encircled-ring.sente {
    border: 3.5px solid #ffffff;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.8), inset 0 0 6px rgba(255, 255, 255, 0.4);
    background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, rgba(15, 23, 42, 0.6) 70%);
  }

  .encircled-ring.gote {
    border: 3.5px solid #ef4444;
    box-shadow: 0 0 10px rgba(239, 68, 68, 0.8), inset 0 0 6px rgba(239, 68, 68, 0.4);
    background: radial-gradient(circle, rgba(239, 68, 68, 0.25) 0%, rgba(15, 23, 42, 0.6) 70%);
  }

  .encircled-ring .hand-icon {
    font-size: 1.5rem;
    line-height: 1;
  }

  .hand-selector { width: 100%; margin-top: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .hand-selector-title { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }
  .hand-buttons { display: flex; gap: 10px; width: 100%; justify-content: center; }
  .hand-btn {
    flex: 1; max-width: 120px; background: rgba(15, 23, 42, 0.8);
    border: 2px solid var(--border); border-radius: 10px; padding: 6px 4px;
    color: var(--text
